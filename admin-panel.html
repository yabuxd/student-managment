<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | EduPortal</title>
  <link rel="stylesheet" href="/src/css/global.css">
  <link rel="stylesheet" href="/src/css/extensions.css">
  <script type="module" src="/src/js/extensions.js" defer></script>
</head>
<body class="bg-stone-50 ethiopian-pattern">
  <div style="max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem;">
    <header class="welcome-section ethiopian-border" style="margin-bottom: 1.5rem;">
      <h1 class="font-serif welcome-title">Admin <span class="italic">Panel</span></h1>
      <p class="welcome-subtitle">Manage users, academic records, and communication workflows.</p>
    </header>

    <div class="ep-parent-grid">
      <section class="ep-parent-card">
        <h3 class="card-title">System Overview</h3>
        <div class="ep-parent-stat"><span class="ep-reg-label">Students</span><span class="ep-parent-stat-val">1,248</span></div>
        <div class="ep-parent-stat"><span class="ep-reg-label">Teachers</span><span class="ep-parent-stat-val">87</span></div>
        <div class="ep-parent-stat"><span class="ep-reg-label">Pending Feedback Cases</span><span class="ep-parent-stat-val">6</span></div>
      </section>

      <section class="ep-parent-card">
        <h3 class="card-title">Quick Actions</h3>
        <div style="display: grid; gap: 0.75rem;">
          <a href="/teacher-panel.html" class="btn-text-action" style="text-decoration: none;">Open Teacher Dashboard</a>
          <a href="/dashboard.html" class="btn-text-action" style="text-decoration: none;">Open Student Dashboard</a>
          <a href="/parent-panel.html" class="btn-text-action" style="text-decoration: none;">Open Parent Portal</a>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
