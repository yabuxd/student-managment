<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - EduPortal</title>
    <link rel="stylesheet" href="/src/css/global.css" />
    <link rel="stylesheet" href="/src/css/login.css" />
  </head>
  <body>
    <main id="login-page" class="login-container">
      <!-- Left Side: Immersive Image -->
      <div class="login-visual">
        <div class="login-visual-bg">
          <img
            src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=2070"
            alt="Library books"
            class="hero-image"
            referrerpolicy="no-referrer"
          />
          <div class="hero-overlay"></div>
        </div>
        
        <div class="login-visual-content">
          <a href="/" class="logo-container" style="text-decoration: none; color: inherit;">
            <div class="logo-icon-white">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
            </div>
            <span class="logo-text-white">EduPortal</span>
          </a>
          
          <div class="login-visual-text">
            <h2 class="login-visual-title">
              The journey of a thousand miles begins with a <span class="italic">single page.</span>
            </h2>
            <div class="divider-white"></div>
            <p class="login-visual-subtitle uppercase tracking-widest">
              Welcome to our community of learners
            </p>
          </div>
        </div>
      </div>

      <!-- Right Side: Login Form -->
      <div class="login-form-side">
        <a href="/" class="mobile-logo" style="text-decoration: none; color: inherit;">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
          </div>
          <span class="logo-text-mobile">EduPortal</span>
        </a>

        <div class="login-form-wrapper">
          <div class="login-card">
            <div class="login-header">
              <div class="login-icon-box">
                <svg class="login-icon-main" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
              </div>
              <h1 class="login-title">
                Welcome <span class="italic-serif accent-text">Back</span>
              </h1>
              <p class="login-subtitle">
                Enter your credentials to access your personalized learning environment.
              </p>
            </div>

            <!-- Tabs -->
            <div class="tabs-container">
              <button id="tab-student" class="tab-btn active">
                Student
              </button>
              <button id="tab-teacher" class="tab-btn inactive">
                Teacher
              </button>
              <div id="tab-indicator" class="tab-indicator"></div>
            </div>

            <form id="login-form" class="login-form">
              <div class="form-group">
                <label id="id-label" class="form-label uppercase" for="idNumber">
                  Student Identity
                </label>
                <div class="input-wrapper group">
                  <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  </div>
                  <input
                    id="idNumber"
                    type="text"
                    required
                    placeholder="ID Number"
                    class="form-input"
                  />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label uppercase" for="password">
                  Secret Key
                </label>
                <div class="input-wrapper group">
                  <div class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  </div>
                  <input
                    id="password"
                    type="password"
                    required
                    placeholder="••••••••"
                    class="form-input"
                  />
                </div>
              </div>

              <div class="form-options">
                <label class="checkbox-container">
                  <input type="checkbox" checked>
                  <span class="checkmark"></span>
                  <span class="label-text">Remember me</span>
                </label>
                <button type="button" class="btn-forgot">
                  Forgot Password?
                </button>
              </div>

              <button type="submit" class="btn-submit">
                Enter Portal
                <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>

             
            </form>

          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/js/login.js"></script>
  </body>
</html>
